<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 78 60" width="312" height="240" role="img" aria-label="Foquinha — Human Authorship Coach">
  <defs>
    <linearGradient id="focaBodyGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="65%" stop-color="#F7F4EE" />
      <stop offset="100%" stop-color="#EAE4D8" />
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="28" cy="41" rx="21" ry="3" fill="#2D2D2D" opacity="0.12" />

  <!-- Tail (TailGroup at 23, 38) -->
  <g transform="translate(23, 38)">
    <path d="M 1,0 C -2,4 1,7 5,6 C 9,7 12,4 9,0 C 7,2 3,2 1,0 Z"
          fill="#F7F4EE" stroke="#2D2D2D" stroke-width="1.8" stroke-linejoin="round" />
  </g>

  <!-- Side Flippers (FlippersContainer) -->
  <g transform="translate(2, 22)">
    <path d="M 11,2 C 5,5 1,11 2,16 C 3,19 8,18 11,13 C 13,9 13,4 11,2 Z"
          fill="#F7F4EE" stroke="#2D2D2D" stroke-width="2.0" stroke-linejoin="round" />
  </g>
  <g transform="translate(40, 22)">
    <path d="M 3,2 C 9,5 13,11 12,16 C 11,19 6,18 3,13 C 1,9 1,4 3,2 Z"
          fill="#F7F4EE" stroke="#2D2D2D" stroke-width="2.0" stroke-linejoin="round" />
  </g>

  <!-- NormalBodyGroup -->
  <g>
    <!-- Outer contrast halo -->
    <ellipse cx="16.25" cy="14.45" rx="3.75" ry="3.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3.2" />
    <ellipse cx="39.75" cy="14.45" rx="3.75" ry="3.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3.2" />
    <path d="M 9.2,42 C 7.0,29.5 10.2,16.2 19.2,11.6 C 23.8,9.2 32.2,9.2 36.8,11.6 C 45.8,16.2 49.0,29.5 46.8,42 Z"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3.8" stroke-linejoin="round" />

    <!-- Ear bumps -->
    <ellipse cx="16.25" cy="14.45" rx="3.75" ry="3.25" fill="#EDE8DF" stroke="#181818" stroke-width="2.2" />
    <ellipse cx="39.75" cy="14.45" rx="3.75" ry="3.25" fill="#EDE8DF" stroke="#181818" stroke-width="2.2" />

    <!-- Chubby squircle body -->
    <path d="M 9.2,42 C 7.0,29.5 10.2,16.2 19.2,11.6 C 23.8,9.2 32.2,9.2 36.8,11.6 C 45.8,16.2 49.0,29.5 46.8,42 Z"
          fill="url(#focaBodyGrad)" stroke="#181818" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Rim light -->
    <path d="M 18.5,13.6 C 23.5,11.2 32.5,11.2 37.5,13.6"
          fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.85" stroke-linecap="round" />

    <!-- Inner plush belly -->
    <path d="M 15.8,42 C 14.8,32.2 17.8,24.5 28,24.5 C 38.2,24.5 41.2,32.2 40.2,42 Z"
          fill="#FFFFFF" stroke="#181818" stroke-opacity="0.133" stroke-width="1.0" opacity="0.92" />
  </g>

  <!-- Bottom front flippers -->
  <path d="M 9,42 C 9,37 18,37 19,41 C 19,42 9,42 9,42 Z" fill="#F7F4EE" stroke="#2D2D2D" stroke-width="1.8" stroke-linejoin="round" />
  <path d="M 47,42 C 47,37 38,37 37,41 C 37,42 47,42 47,42 Z" fill="#F7F4EE" stroke="#2D2D2D" stroke-width="1.8" stroke-linejoin="round" />

  <!-- FaceContainer -->
  <g>
    <!-- Cheeks -->
    <ellipse cx="13.75" cy="29.5" rx="3.75" ry="2.5" fill="#F4A896" opacity="0.65" />
    <ellipse cx="42.25" cy="29.5" rx="3.75" ry="2.5" fill="#F4A896" opacity="0.65" />

    <!-- EyesActive -->
    <g>
      <ellipse cx="19.5" cy="23" rx="5.5" ry="6" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="1.8" />
      <circle cx="19.45" cy="23.05" r="3.25" fill="#2D2D2D" />
      <circle cx="18.5" cy="22.1" r="1.3" fill="#FFFFFF" />
      <circle cx="21.05" cy="24.65" r="0.65" fill="#FFFFFF" />

      <ellipse cx="36.5" cy="23" rx="5.5" ry="6" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="1.8" />
      <circle cx="36.45" cy="23.05" r="3.25" fill="#2D2D2D" />
      <circle cx="35.5" cy="22.1" r="1.3" fill="#FFFFFF" />
      <circle cx="38.05" cy="24.65" r="0.65" fill="#FFFFFF" />
    </g>

    <!-- Fact-Checker Glasses (Item_FactCheckerGlasses) -->
    <g>
      <ellipse cx="19.5" cy="23" rx="6.5" ry="7" fill="#FFFFFF" fill-opacity="0.063" stroke="#2D2D2D" stroke-width="1.8" />
      <ellipse cx="36.5" cy="23" rx="6.5" ry="7" fill="#FFFFFF" fill-opacity="0.063" stroke="#2D2D2D" stroke-width="1.8" />
      <line x1="26" y1="22" x2="30" y2="22" stroke="#2D2D2D" stroke-width="2.0" />
      <line x1="13" y1="21" x2="7" y2="19" stroke="#2D2D2D" stroke-width="1.6" stroke-linecap="round" />
      <line x1="43" y1="21" x2="49" y2="19" stroke="#2D2D2D" stroke-width="1.6" stroke-linecap="round" />
    </g>

    <!-- SnoutGroup -->
    <g>
      <ellipse cx="28" cy="29.75" rx="7.5" ry="4.75" fill="#FFFDF9" stroke="#181818" stroke-width="1.5" />
      <path d="M 26,26 C 26,24.5 30,24.5 30,26 C 30,27.5 28.5,29 28,29 C 27.5,29 26,27.5 26,26 Z" fill="#2D2D2D" />
      <ellipse cx="27.75" cy="25.7" rx="0.75" ry="0.5" fill="#FFFFFF" />
    </g>

    <!-- MouthClosed -->
    <path d="M 24,30 Q 28,32.5 28,29.5 Q 28,32.5 32,30"
          fill="none" stroke="#2D2D2D" stroke-width="1.6" stroke-linecap="round" />

    <!-- Whiskers -->
    <g transform="translate(18, 30)">
      <path d="M 0,-1.5 L -9,-3 M 0,0.5 L -9.5,1 M 0.5,2.5 L -8,4"
            fill="none" stroke="#2D2D2D" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <g transform="translate(37.5, 30)">
      <path d="M 0,-1.5 L 9,-3 M 0,0.5 L 9.5,1 M -0.5,2.5 L 8,4"
            fill="none" stroke="#2D2D2D" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- InvestigatorNotepad (Left Flipper) -->
  <g transform="translate(1.5, 24.5) rotate(-11 5.25 6.5)">
    <rect x="0" y="0" width="10.5" height="13" rx="1.8" ry="1.8" fill="#FFC000" stroke="#2D2D2D" stroke-width="1.3" />
    <rect x="1.1" y="2.1" width="8.3" height="9.8" rx="1" ry="1" fill="#FFFBEB" />
    <line x1="2.2" y1="4.4" x2="8.0" y2="4.4" stroke="#2D2D2D" stroke-width="0.9" stroke-linecap="round" />
    <line x1="2.2" y1="6.8" x2="7.2" y2="6.8" stroke="#2D2D2D" stroke-width="0.9" stroke-linecap="round" />
    <line x1="2.2" y1="9.2" x2="6.4" y2="9.2" stroke="#C4170C" stroke-width="0.9" stroke-linecap="round" />
  </g>

  <!-- WritingGroup Pencil (Right Flipper, ready for human author) -->
  <g transform="translate(50.5, 25.5) rotate(-36)">
    <rect x="0" y="0" width="9.5" height="2.6" rx="0.6" ry="0.6" fill="#FFC000" stroke="#2D2D2D" stroke-width="0.9" />
    <rect x="7.4" y="0" width="2.1" height="2.6" rx="0.4" ry="0.4" fill="#C4170C" stroke="#2D2D2D" stroke-width="0.9" />
    <polygon points="0,0 -2.6,1.3 0,2.6" fill="#F5E6CA" stroke="#2D2D2D" stroke-width="0.8" stroke-linejoin="round" />
    <polygon points="-1.4,0.7 -2.6,1.3 -1.4,1.9" fill="#2D2D2D" />
  </g>

  <!-- Socratic Question Badge (Top right subtle stamp) -->
  <g transform="translate(47, -2)">
    <circle cx="6.2" cy="6.2" r="6.2" fill="#FFC000" stroke="#181818" stroke-width="1.6" />
    <text x="6.2" y="9.1" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-weight="900" font-size="8.6" fill="#181818">?</text>
  </g>
</svg>
